name: Hal CI/CD

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual build from GitHub UI'

  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'
      - 'test/**'
      - 'ci/**'
      - main
    paths:
      - '**/src/Chatter.Rest.Hal/**'
      - '.github/workflows/hal-cicd.yml'
      - '**/test/Chatter.Rest.Hal.Tests/**'

  pull_request:
    branches:
      - main
    paths:
      - '**/src/Chatter.Rest.Hal/**'
      - '.github/workflows/hal-cicd.yml'
      - '**/test/Chatter.Rest.Hal.Tests/**'

env:
  dotnet-version: '8.0.x'

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.dotnet-version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test '/home/runner/work/Chatter.Rest.Hal/Chatter.Rest.Hal/test/Chatter.Rest.Hal.Tests/Chatter.Rest.Hal.Tests.csproj' -c Release --no-build

      - name: Pack
        run: dotnet pack '/home/runner/work/Chatter.Rest.Hal/Chatter.Rest.Hal/src/Chatter.Rest.Hal/Chatter.Rest.Hal.csproj' -c Release --no-build -o publish/nuget

      - name: Upload NuGet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuget
          path: /home/runner/work/Chatter.Rest.Hal/Chatter.Rest.Hal/publish/nuget/**
          retention-days: 5
          if-no-files-found: error

  version-check:
    name: version-check
    uses: ./.github/workflows/version-check.yml
    if: github.event_name == 'pull_request'
    with:
      src-path: 'src/Chatter.Rest.Hal/'
      csproj-path: 'src/Chatter.Rest.Hal/Chatter.Rest.Hal.csproj'
      tag-prefix: 'hal'

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # main branch is protected, so this will only be true after successsful PR merge

    environment:
      name: Production

    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY_CHATTER_HAL }}
      NUGET_URL: https://api.nuget.org/v3/index.json

    permissions:
      contents: read

    steps:
      - name: Download NuGet
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nuget
          path: ./dist/nuget

      - name: Push NuGet packages
        shell: bash
        run: |
          dotnet nuget push "./dist/nuget/*.nupkg" \
            -k "$NUGET_AUTH_TOKEN" \
            -s '${{ env.NUGET_URL }}' \
            --skip-duplicate

  tag:
    name: tag
    uses: ./.github/workflows/create-version-tag.yml
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    with:
      csproj-path: 'src/Chatter.Rest.Hal/Chatter.Rest.Hal.csproj'
      tag-prefix: 'hal'
      package-name: 'Chatter.Rest.Hal'