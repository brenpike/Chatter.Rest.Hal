name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages-build:
    name: pages-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Stage site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/licenses
          cp site/index.html _site/index.html
          cp site/licenses/OFL-ChakraPetch.txt _site/licenses/
          cp site/licenses/OFL-IBMPlexMono.txt _site/licenses/

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install site dependencies
        working-directory: site
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify committed index.html matches build output
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          node build.js
          if ! cmp -s ../_site/index.html index.html; then
            echo "::error file=site/index.html::Committed index.html does not match build.js output. Run npm ci and node build.js in site/, then commit index.html."
            git diff --stat -- index.html
            exit 1
          fi
          changes="$(git status --porcelain --untracked-files=all -- .)"
          if [ -n "$changes" ]; then
            echo "::error::Building the site left uncommitted changes under site/."
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  pages-deploy:
    name: pages-deploy
    needs: pages-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
