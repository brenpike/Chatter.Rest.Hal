<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chatter.Rest.Hal — Islands → Graph</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#04070a; --panel:rgba(7,13,18,.94); --line:#1b2b34; --txt:#cfe0ea; --mut:#60798a;
  --g:#3dff9a; --c:#27e6ff; --m:#ff3fd8; --r:#ff3b5c;
  --mono: ui-monospace,"JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#fit{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;background:var(--bg);font-family:var(--mono);color:var(--txt)}
#bg{position:absolute;inset:0;
  background:
   radial-gradient(900px 520px at 12% 8%, rgba(61,255,154,.075), transparent 60%),
   radial-gradient(900px 560px at 92% 96%, rgba(255,63,216,.07), transparent 60%),
   linear-gradient(rgba(61,255,154,.045) 1px, transparent 1px) 0 0/40px 40px,
   linear-gradient(90deg, rgba(61,255,154,.045) 1px, transparent 1px) 0 0/40px 40px;}
#sweep{position:absolute;left:0;width:100%;height:160px;background:linear-gradient(to bottom,transparent,rgba(61,255,154,.045),transparent)}
#world{position:absolute;inset:0}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.16) 3px 4px)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.62) 100%)}
#flash{position:absolute;inset:0;background:var(--r);opacity:0;pointer-events:none;mix-blend-mode:screen}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
svg.layer{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none;overflow:visible}

/* cards */
.card{position:absolute;left:0;top:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  font-size:12.5px;line-height:20px;overflow:hidden;opacity:0}
.card.nest{position:relative;margin:0}
.hdr{height:28px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);font-size:12.5px;letter-spacing:.04em;color:var(--mut);background:linear-gradient(90deg,rgba(255,255,255,.025),transparent)}
.hdr .verb{color:var(--g);margin-right:9px;font-weight:700}
.hdr .path{color:#a9c3d1}
.body{padding:8px 14px 10px}
.blk{overflow:hidden}
.ln{height:20px;border-radius:3px;white-space:pre}
.sm .body{padding:8px 12px 10px}
.i1{padding-left:2ch}.i2{padding-left:4ch}.i3{padding-left:6ch}
.k{color:#8db3c7}.s{color:#8dffc0}.n{color:#ff86df}
.kl{color:var(--c);font-weight:700}.ke{color:var(--m);font-weight:700}
.slot{margin:2px 0 2px 0}
.endb,.cm{color:var(--txt)}

/* chips (brittle client code) */
.chip{position:absolute;left:0;top:0;padding:7px 14px;border:1px solid rgba(255,59,92,.6);background:rgba(44,6,16,.78);
  color:#ff93a6;border-radius:6px;font-size:14.5px;line-height:20px;white-space:pre;opacity:0}
.chip .tag{position:absolute;left:10px;top:-9px;font-size:10px;letter-spacing:.12em;background:var(--bg);color:#a8485b;padding:0 5px}
.stamp{position:absolute;left:0;top:0;padding:3px 10px 4px;border:2px solid var(--r);color:var(--r);font-weight:800;font-size:19px;letter-spacing:.08em;
  background:rgba(40,4,12,.88);border-radius:4px;opacity:0;white-space:nowrap;text-shadow:0 0 10px rgba(255,59,92,.8);box-shadow:0 0 18px rgba(255,59,92,.45)}
.stamp small{display:block;font-size:9.5px;letter-spacing:.2em;font-weight:600;margin-top:-2px;text-align:center}
.pill{position:absolute;left:0;top:0;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid rgba(39,230,255,.6);background:#06151b;color:#86f1ff;white-space:nowrap;opacity:0;letter-spacing:.02em}

/* chrome */
#beat{position:absolute;left:36px;top:22px;font-size:12.5px;letter-spacing:.2em;color:var(--mut);display:flex;gap:12px;align-items:center}
#beat b{color:var(--g);font-weight:700}
#segs{position:absolute;right:36px;top:27px;display:flex;gap:6px}
#segs i{display:block;width:34px;height:3px;border-radius:2px;background:#13212a}
#crumb{position:absolute;left:0;right:0;top:30px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:13px;opacity:0}
#crumb .lb{color:var(--mut);letter-spacing:.18em;font-size:11px;margin-right:6px}
#crumb .cr{padding:4px 12px;border:1px solid var(--line);border-radius:999px;color:#4e6573;background:rgba(7,13,18,.8)}
#crumb .sp{color:#2c4350}
#cap{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:32px;font-weight:700;letter-spacing:-.01em;white-space:pre;color:#eaf4f9;text-shadow:0 0 18px rgba(255,255,255,.12)}
#cap .r{color:var(--r);text-shadow:0 0 16px rgba(255,59,92,.55)}
#cap .c{color:var(--c);text-shadow:0 0 16px rgba(39,230,255,.5)}
#cap .g{color:var(--g);text-shadow:0 0 16px rgba(61,255,154,.5)}
#cap .m{color:var(--m);text-shadow:0 0 16px rgba(255,63,216,.5)}
#cap .x{text-decoration:line-through;text-decoration-thickness:3px}
#cap .cur{display:inline-block;width:.55em;height:1em;vertical-align:-.12em;background:var(--g);margin-left:3px;box-shadow:0 0 12px var(--g)}

/* outro */
#outro{position:absolute;inset:0;opacity:0}
#wm{position:absolute;left:0;right:0;top:44px;text-align:center;font-size:58px;font-weight:800;letter-spacing:-.02em;color:#effff6;
  text-shadow:0 0 22px rgba(61,255,154,.65),0 0 60px rgba(61,255,154,.3)}
#wm .d{color:var(--g)}
#tag{position:absolute;left:0;right:0;top:122px;text-align:center;font-size:21px;color:#9fe9ff;letter-spacing:.02em}
#tag b{color:var(--m);font-weight:700}
#tag em{font-style:normal;color:var(--mut)}
#code{position:absolute;left:260px;top:182px;width:760px;border:1px solid #1f3a46;border-radius:12px;background:rgba(5,10,14,.96);
  box-shadow:0 0 0 1px rgba(61,255,154,.06),0 0 50px rgba(39,230,255,.12),0 20px 60px rgba(0,0,0,.6);overflow:hidden}
#code .bar{height:32px;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid #16272f;font-size:12px;color:var(--mut);letter-spacing:.06em}
#code .bar i{width:10px;height:10px;border-radius:50%;background:#1c2e38}
#code .bar span{margin-left:10px}
#code pre{margin:0;padding:14px 20px 18px 14px;font:inherit;font-size:15.5px;line-height:28px;white-space:pre;font-family:var(--mono)}
.cl{height:28px}
.cl .ln-n{display:inline-block;width:3ch;color:#2f4755;text-align:right;margin-right:16px;user-select:none}
.t-kw{color:var(--m)}.t-ty{color:#f4fbff;font-weight:700}.t-m{color:var(--c)}.t-s{color:#8dffc0}.t-n{color:#ff86df}.t-p{color:#a8c9da}.t-pu{color:#5b7584}
#code .cur,#inst .cur{display:inline-block;width:.6em;height:1.05em;vertical-align:-.18em;background:var(--g);box-shadow:0 0 10px var(--g)}
#inst{position:absolute;left:0;right:0;top:524px;display:flex;justify-content:center;opacity:0}
#inst div{padding:11px 26px;border:1px solid rgba(61,255,154,.5);border-radius:10px;background:rgba(5,16,12,.9);font-size:20px;color:#eaffef;
  box-shadow:0 0 28px rgba(61,255,154,.25),inset 0 0 20px rgba(61,255,154,.06)}
#inst .pr{color:var(--g);margin-right:12px}
#inst .pk{color:var(--g);font-weight:700}
#foot{position:absolute;left:0;right:0;top:612px;text-align:center;font-size:13px;letter-spacing:.14em;color:#4c6574;opacity:0}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="bg"></div>
  <div id="sweep"></div>
  <div id="world">
    <svg class="layer" id="under"><defs>
      <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow2" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs><g id="rings"></g></svg>
    <div id="cards"></div>
    <div id="chips"></div>
    <svg class="layer" id="fx"><g id="conn" filter="url(#glow2)"></g><g id="edges" filter="url(#glow)"></g><g id="sparks" filter="url(#glow2)"></g></svg>
    <div id="pills"></div>
    <div id="stamps"></div>
  </div>
  <div id="outro">
    <div id="wm">Chatter<span class="d">.</span>Rest<span class="d">.</span>Hal</div>
    <div id="tag">HAL for <b>.NET</b> <em>—</em> fluent builders, System.Text.Json</div>
    <div id="code"><div class="bar"><i></i><i></i><i></i><span>Orders.cs</span></div><pre id="codepre"></pre></div>
    <div id="inst"><div><span class="pr">$</span>dotnet add package <span class="pk">Chatter.Rest.Hal</span><span class="cur" id="icur"></span></div></div>
    <div id="foot">github.com/brenpike/Chatter.Rest.Hal  ·  MIT</div>
  </div>
  <div id="crumb"><span class="lb">FOLLOW RELS</span><span class="cr">GET /orders</span><span class="sp">▸</span><span class="cr">next</span><span class="sp">▸</span><span class="cr">ea:order</span><span class="sp">▸</span><span class="cr">ea:customer</span></div>
  <div id="beat"></div><div id="segs"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="cap"></div>
  <div id="scan"></div><div id="vig"></div><div id="flash"></div><div id="fade"></div>
</div></div>

<script>
(()=>{
const DUR=13.0, W=1280, H=720, FINAL_T=12.4;
const $=(s,r=document)=>r.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
const hsh=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const mixc=(a,b,k)=>a.map((v,i)=>Math.round(lerp(v,b[i],k)));
const LINE=[27,43,52],GRN=[61,255,154],RED=[255,59,92],CYA=[39,230,255];
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const NS='http://www.w3.org/2000/svg';
const sv=(tag,at,par)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par&&par.appendChild(e);return e};

/* ---------- JSON-ish colouriser ---------- */
function col(s){
  return s.replace(/("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?)/g,(m,str,colon,num)=>{
    if(str&&colon){const c=str==='"_links"'?'kl':str==='"_embedded"'?'ke':'k';return `<span class="${c}">${esc(str)}</span>${colon}`}
    if(str)return `<span class="s">${esc(str)}</span>`;
    return `<span class="n">${num}</span>`;
  });
}
const L=(txt,o={})=>`<div class="ln ${o.i?'i'+o.i:''}"${o.a?` data-a="${o.a}"`:''}>${col(txt)}${o.extra||''}</div>`;
const HDR=(p)=>`<div class="hdr"><span class="verb">GET</span><span class="path">${p}</span></div>`;

/* ---------- build cards ---------- */
const cardsEl=$('#cards');
const defs={
 p1:{html:HDR('/orders')+`<div class="body">
   ${L('{ "currentlyProcessing": 14',{extra:'<span class="cm">,</span><span class="endb"> }</span>'})}
   <div class="blk" data-blk="links">${L('"_links": {',{i:1})}${L('"self": { "href": "/orders" },',{i:2})}${L('"next": { "href": "/orders?page=2" }',{i:2,a:'next'})}${L('},',{i:1})}</div>
   <div class="blk" data-blk="emb">${L('"_embedded": { "ea:order": [',{i:1})}<div class="slot" id="p1slot"></div>${L('] }',{i:1})}${L('}')}</div>
 </div>`},
 o123:{html:HDR('/orders/123')+`<div class="body">
   ${L('{ "id": 123, "total": 30.00',{extra:'<span class="cm">,</span>'})}
   ${L('"status": "shipped"',{i:1,extra:'<span class="endb"> }</span><span class="cm">,</span>'})}
   <div class="blk" data-blk="links">${L('"_links": {',{i:1})}${L('"self": { "href": "/orders/123" },',{i:2})}${L('"ea:customer": { "href": "/customers/9" },',{i:2,a:'cust'})}${L('"ea:basket": { "href": "/baskets/7" }',{i:2,a:'bask'})}${L('}',{i:1})}${L('}')}</div>
 </div>`},
 cust:{html:HDR('/customers/9')+`<div class="body">
   ${L('{ "id": 9, "name": "Ada"',{extra:'<span class="cm">,</span><span class="endb"> }</span>'})}
   <div class="blk" data-blk="links">${L('"_links": {',{i:1})}${L('"self": { "href": "/customers/9" }',{i:2})}${L('}',{i:1})}${L('}')}</div>
 </div>`},
 bask:{html:HDR('/baskets/7')+`<div class="body">
   ${L('{ "id": 7, "items": 3',{extra:'<span class="cm">,</span><span class="endb"> }</span>'})}
   <div class="blk" data-blk="links">${L('"_links": {',{i:1})}${L('"self": { "href": "/baskets/7" }',{i:2})}${L('}',{i:1})}${L('}')}</div>
 </div>`},
 p2:{html:HDR('/orders?page=2')+`<div class="body">
   ${L('{ "currentlyProcessing": 9',{extra:'<span class="cm">,</span>'})}
   <div class="blk" data-blk="links">${L('"_links": {',{i:1})}${L('"self": { "href": "/orders?page=2" }',{i:2})}${L('},',{i:1})}</div>
   <div class="blk" data-blk="emb" id="p2emb">${L('"_embedded": { "ea:order": [',{i:1,a:'embl'})}
     <div class="slot"><div class="card nest sm" id="o124" style="opacity:1">${HDR('/orders/124')}<div class="body">
        ${L('{ "id": 124, "total": 12.50',{extra:'<span class="cm">,</span>'})}
        ${L('"_links": {',{i:1})}${L('"ea:customer": {',{i:2,a:'cust'})}${L('"href": "/customers/9"',{i:3})}${L('}',{i:2})}${L('}',{i:1})}${L('}')}
     </div></div></div>
     ${L('] }',{i:1})}${L('}')}</div>
 </div>`},
};
const cards={};
for(const id of ['p1','o123','cust','bask','p2']){
  const el=document.createElement('div');el.className='card'+(id==='o123'?' sm':'');el.id=id;el.innerHTML=defs[id].html;cardsEl.appendChild(el);
  cards[id]={id,el,blocks:{}};
}
cards.o124={id:'o124',el:$('#o124'),blocks:{}};
/* block natural heights */
for(const c of Object.values(cards)){
  c.el.querySelectorAll('[data-blk]').forEach(b=>{c.blocks[b.dataset.blk]={el:b,nat:0}});
  c.endb=[...c.el.querySelectorAll('.endb')];
  c.cm=[...c.el.querySelectorAll('.cm')];
}
/* slot for o123 inside p1 needs natural height of o123 */
(()=>{
  cards.o123.el.style.width='380px';cards.o123.el.style.opacity=1;
  const sl=$('#p1slot');sl.style.height=cards.o123.el.offsetHeight+'px';
  for(const c of Object.values(cards))for(const k in c.blocks)c.blocks[k].nat=c.blocks[k].el.offsetHeight;
  cards.o123.el.style.opacity=0;
})();
const slotEl=$('#p1slot');

/* ---------- chips ---------- */
const CHIPS=[
 {card:'p1',  text:'$"{host}/orders"',y:372,dx:46},
 {card:'o123',text:'"https://api.example.com/orders/123"',y:492,dx:-40},
 {card:'cust',text:'baseUrl + "/customers/" + id',y:362,dx:40},
 {card:'bask',text:'baseUrl + "/baskets/" + basketId',y:482,dx:-36},
];
const chipsEl=$('#chips'),stampsEl=$('#stamps'),connG=$('#conn'),sparkG=$('#sparks'),ringG=$('#rings');
CHIPS.forEach((c,i)=>{
  const el=document.createElement('div');el.className='chip';el.innerHTML=`<span class="tag">CLIENT</span>${esc(c.text)}`;chipsEl.appendChild(el);c.el=el;c.w=el.offsetWidth;
  c.path=sv('path',{fill:'none',stroke:'#ff3b5c','stroke-width':1.8,pathLength:1,'stroke-linecap':'butt'},connG);
  const st=document.createElement('div');st.className='stamp';st.innerHTML='404<small>NOT FOUND</small>';stampsEl.appendChild(st);c.stamp=st;
  c.dot=sv('circle',{r:3.2,fill:'#ffb3bf'},sparkG);
  c.sparks=[...Array(8)].map(()=>sv('circle',{r:2,fill:'#ff8fa3'},sparkG));
});
/* island rings */
const rings=['p1','o123','cust','bask'].map((id,i)=>({id,el:sv('ellipse',{rx:200,ry:62,fill:'none',stroke:'rgba(61,255,154,.16)','stroke-width':1.2,'stroke-dasharray':'2 9'},ringG)}));

/* ---------- edges ---------- */
const pillsEl=$('#pills'),edgesG=$('#edges');
const EDGES=[
 {id:'next',host:'p1',a:'next',side:'R',to:'p2',label:'next',show:[6.0,6.6]},
 {id:'cust',host:'p1',a:'cust',anchorCard:'o123',side:'R',to:'cust',label:'ea:customer',show:[6.2,6.8]},
 {id:'bask',host:'p1',a:'bask',anchorCard:'o123',side:'R',to:'bask',label:'ea:basket',show:[6.3,6.9]},
 {id:'cust2',host:'p2',a:'cust',anchorCard:'o124',side:'L',to:'cust',label:'ea:customer',show:[8.5,8.95],hot:[8.5,9.2]},
];
for(const e of EDGES){
  e.base=sv('path',{fill:'none',stroke:'rgba(39,230,255,.78)','stroke-width':1.8,pathLength:1,'stroke-linecap':'round'},edgesG);
  e.hotp=sv('path',{fill:'none',stroke:'#3dff9a','stroke-width':3.2,pathLength:1,'stroke-linecap':'round'},edgesG);
  e.arrow=sv('path',{fill:'#27e6ff'},edgesG);
  e.port=sv('circle',{r:3.6,fill:'#27e6ff'},edgesG);
  e.dot=sv('circle',{r:6,fill:'#eafff4'},edgesG);
  e.pill=document.createElement('div');e.pill.className='pill';e.pill.textContent=e.label;pillsEl.appendChild(e.pill);
  e.aEl=cards[e.anchorCard||e.host].el.querySelector(`[data-a="${e.a}"]`);
}
/* little in-card pulse (ea:order step) */
const inPath=sv('path',{fill:'none',stroke:'#3dff9a','stroke-width':3,pathLength:1,'stroke-linecap':'round'},edgesG);
const inDot=sv('circle',{r:5.5,fill:'#eafff4'},edgesG);

/* ---------- code ---------- */
const CODE=[
 'var resource = ResourceBuilder.WithState(new { currentlyProcessing = 14 })',
 '    .AddSelf().AddLinkObject("/orders")',
 '    .AddLink("next").AddLinkObject("/orders?page=2")',
 '    .AddEmbedded("ea:order")',
 '        .AddResource(new { total = 30.00F, status = "shipped" })',
 '            .AddSelf().AddLinkObject("/orders/123")',
 '    .Build();',
];
function tok(line){
  const out=[];const re=/("[^"]*")|\b(var|new)\b|\b(ResourceBuilder)\b|(\.[A-Z]\w*)(?=\()|\b(\d+(?:\.\d+)?F?)\b|\b(currentlyProcessing|total|status)\b|([{}()=;,.])|(\s+)|(\w+)/g;
  let m,last=0;
  while((m=re.exec(line))){
    const c=m[1]?'t-s':m[2]?'t-kw':m[3]?'t-ty':m[4]?'t-m':m[5]?'t-n':m[6]?'t-p':m[7]?'t-pu':m[8]?'':'t-p';
    out.push({t:m[0],c});
  }
  return out;
}
const CT=CODE.map(tok);
const CODELEN=CODE.reduce((a,l)=>a+l.length+1,0);
function codeHTML(n){
  let left=n,html='',cursorDone=false;
  CT.forEach((toks,li)=>{
    let h='';
    for(const k of toks){ if(left<=0)break; const s=k.t.slice(0,left); left-=k.t.length; h+=k.c?`<span class="${k.c}">${esc(s)}</span>`:esc(s); }
    left-=1;
    const showCur=!cursorDone&&left<=0&&n<CODELEN&&(h!==''||li===0||true)&&(left>-1?true:false);
    html+=`<div class="cl"><span class="ln-n">${li+1}</span>${h}${(!cursorDone&&left<=0&&left>-2&&n<CODELEN&&h!==''||(!cursorDone&&n>=CODELEN&&li===CT.length-1))?(cursorDone=true,'<span class="cur"></span>'):''}</div>`;
  });
  return html;
}

/* ---------- captions ---------- */
const CAPS=[
 {a:.55,b:3.05,parts:[['Your API returns data. ',''],['Clients guess the URLs.','r']]},
 {a:3.1,b:4.55,parts:[['One URL changes. ',''],['404.','r']]},
 {a:4.6,b:6.95,parts:[['Every resource carries its ',''],['own links.','c']]},
 {a:6.95,b:9.7,parts:[['Follow links, ','g'],['not hardcoded URLs.','r x']]},
];
const capEl=$('#cap');
function capHTML(cp,t){
  const total=cp.parts.reduce((a,p)=>a+p[0].length,0);
  const n=Math.floor((t-cp.a)*46);
  let left=n,h='';
  for(const [s,c] of cp.parts){ if(left<=0)break; const sub=s.slice(0,left); left-=s.length; h+=c?`<span class="${c}">${esc(sub)}</span>`:esc(sub); }
  const blink=Math.floor(t*2.4)%2===0||n<total;
  return h+(blink?'<span class="cur"></span>':'');
}
const BEATS=[[0,3.05,'01','THE PROBLEM'],[3.05,4.55,'02','THE BREAK'],[4.55,6.95,'03','HAL LINKS'],[6.95,9.7,'04','TRAVERSE'],[9.7,99,'05','HOW']];
const segs=[...document.querySelectorAll('#segs i')];

/* ---------- layout specs ---------- */
const SC=1.25;
const ISL={p1:{x:40,y:140,w:250,ap:.25,ph:0},o123:{x:318,y:285,w:250,ap:.5,ph:1.7},cust:{x:650,y:135,w:250,ap:.75,ph:3.1},bask:{x:940,y:268,w:250,ap:1.0,ph:4.4}};
const FIN={p1:{x:20,y:84,w:410,mv:4.5,lk:5.3},cust:{x:520,y:250,w:316,mv:4.65,lk:5.5},bask:{x:520,y:440,w:316,mv:4.8,lk:5.6},o123:{mv:4.7,lk:5.4},p2:{x:928,y:84,w:332}};
const MV=1.0;

let SR,K=1;
function measure(){SR=$('#stage').getBoundingClientRect();K=SR.width/W}
function R(el){const r=el.getBoundingClientRect();return{x:(r.left-SR.left)/K,y:(r.top-SR.top)/K,w:r.width/K,h:r.height/K}}
function setBlk(c,name,p,vis=true){const b=c.blocks[name];b.el.style.height=(b.nat*p)+'px';b.el.style.opacity=vis?clamp(p*1.6):0}
function setLinkedState(c,p){c.endb.forEach(e=>{e.style.opacity=1-clamp(p*3);e.style.display=p>.34?'none':'inline'});c.cm.forEach(e=>e.style.opacity=clamp(p*3))}
function style(c,{hot=0,red=0,lin=0,op=1}){
  let b=mixc(LINE,CYA.map(v=>v*.55|0),lin); b=mixc(b,RED,red); b=mixc(b,GRN,hot);
  c.el.style.borderColor=rgb(b);
  c.el.style.boxShadow=`0 0 ${30*hot}px rgba(61,255,154,${.38*hot}),0 0 ${26*red}px rgba(255,59,92,${.45*red}),0 0 ${18*lin}px rgba(39,230,255,${.1*lin}),0 14px 40px rgba(0,0,0,.5)`;
  c.el.style.opacity=op;
}
const bump=(t,a,d)=>{const k=(t-a)/d;return k<0||k>1?0:1-k};

/* ---------- main render ---------- */
function render(t){
  t=((t%DUR)+DUR)%DUR;
  measure();
  const world=$('#world');

  /* stage glitch */
  let jx=0;
  if((t>3.48&&t<3.56)||(t>3.78&&t<3.84)){jx=(hsh(Math.floor(t*60))-.5)*14}
  world.style.transform=`translate(${jx}px,0)`;
  $('#flash').style.opacity=.2*bump(t,3.5,.25)+.12*bump(t,3.78,.2);
  $('#sweep').style.top=((t*70)%(H+320)-200)+'px';

  const linked=prog(t,5.6,6.4);
  const dimAmt=prog(t,6.9,7.1)*(1-prog(t,9.6,9.9));
  const red=.9*bump(t,3.5,.7);

  /* traversal hot values */
  const hotP1=prog(t,6.9,7.05)*(1-.62*prog(t,7.7,7.9));
  const hotP2=prog(t,7.65,7.85)*(1-.62*prog(t,8.15,8.35));
  const hotO124=prog(t,8.25,8.45)*(1-.62*prog(t,9.0,9.2));
  const hotCust=prog(t,9.0,9.25);
  const vis={p1:hotP1,p2:Math.max(hotP2,.0),o124:hotO124,cust:hotCust,o123:0,bask:0};
  const opDim=(id,extra=1)=>1-.52*dimAmt*(1-clamp(vis[id]*1.0))*extra;

  /* --- islands/graph cards --- */
  const out={};
  for(const id of ['p1','cust','bask']){
    const c=cards[id],I=ISL[id],F=FIN[id];
    const m=eio(prog(t,F.mv,F.mv+MV));
    const ap=prog(t,I.ap,I.ap+.55);
    const fl=ap<1?(.55+.45*hsh(Math.floor(t*38)+I.ph*9)):1;
    const dr=(1-m);
    const x=lerp(I.x+Math.sin(t*.9+I.ph)*7*dr,F.x,m);
    const y=lerp(I.y+Math.sin(t*1.15+I.ph)*7*dr+(1-eo(ap))*18,F.y,m);
    const w=lerp(I.w,F.w,m);
    const sc=lerp(SC,1,m);
    c.el.style.transformOrigin='0 0';c.el.style.transform=`translate(${x}px,${y}px) scale(${sc.toFixed(4)})`;c.el.style.width=w+'px';
    const lp=eio(prog(t,F.lk,F.lk+.6));
    setBlk(c,'links',lp);setLinkedState(c,lp);
    if(id==='p1'){setBlk(c,'emb',eio(prog(t,5.0,5.8)))}
    style(c,{hot:vis[id],red,lin:linked,op:eo(ap)*fl*(ap>0?1:0)*opDim(id)});
    out[id]={x,y,w,m,ap,sc};
  }
  /* order 123 */
  {
    const c=cards.o123,I=ISL.o123,F=FIN.o123;
    const m=eio(prog(t,F.mv,F.mv+MV));
    const ap=prog(t,I.ap,I.ap+.55);
    const fl=ap<1?(.55+.45*hsh(Math.floor(t*38)+I.ph*9)):1;
    const sr=R(slotEl);
    const dr=1-m;
    const x=lerp(I.x+Math.sin(t*.9+I.ph)*7*dr,sr.x,m);
    const y=lerp(I.y+Math.sin(t*1.15+I.ph)*7*dr+(1-eo(ap))*18,sr.y,m);
    const w=lerp(I.w,sr.w,m);
    const sc=lerp(SC,1,m);
    c.el.style.transformOrigin='0 0';c.el.style.transform=`translate(${x}px,${y}px) scale(${sc.toFixed(4)})`;c.el.style.width=w+'px';
    const lp=eio(prog(t,F.lk,F.lk+.6));
    setBlk(c,'links',lp);setLinkedState(c,lp);
    style(c,{hot:0,red,lin:linked,op:eo(ap)*fl*(ap>0?1:0)*opDim('p1')});
    out.o123={x,y,w,m,ap,sc};
  }
  /* page 2 */
  {
    const c=cards.p2,F=FIN.p2;
    const ap=eo(prog(t,6.0,6.45));
    c.el.style.transform=`translate(${F.x}px,${F.y+(1-ap)*12}px)`;c.el.style.width=F.w+'px';
    setBlk(c,'links',1);setLinkedState(c,1);
    setBlk(c,'emb',eio(prog(t,7.7,8.1)));
    const o=cards.o124;
    style(c,{hot:hotP2,lin:linked,op:ap*opDim('p2')});
    style(cards.o124,{hot:hotO124,lin:linked,op:1});
    cards.o124.el.style.opacity=1;
  }
  /* highlight rows */
  const embLine=cards.p2.el.querySelector('[data-a="embl"]');
  embLine.style.background=`rgba(255,63,216,${.16*prog(t,8.1,8.25)*(1-prog(t,8.5,8.7))})`;

  /* --- rings (island decoration) --- */
  rings.forEach((r,i)=>{
    const o=out[r.id],c=cards[r.id];
    const h=c.el.offsetHeight*o.sc,ow=o.w*o.sc;
    const ap=prog(t,ISL[r.id].ap+.2,ISL[r.id].ap+1);
    const m=1-clamp(prog(t,FIN.p1.mv,FIN.p1.mv+.5));
    r.el.setAttribute('cx',(o.x+ow/2).toFixed(1));r.el.setAttribute('cy',(o.y+h/2+8).toFixed(1));
    r.el.setAttribute('rx',(ow*.78).toFixed(1));r.el.setAttribute('ry',(h*.95+14).toFixed(1));
    r.el.setAttribute('stroke-dashoffset',(-t*7+i*5).toFixed(1));
    r.el.setAttribute('opacity',(ap*m).toFixed(3));
  });

  /* --- chips + connectors --- */
  CHIPS.forEach((ch,i)=>{
    const o=out[ch.card],c=cards[ch.card];
    const a0=1.35+i*.18;
    const inP=eo(prog(t,a0,a0+.45));
    const drift=Math.sin(t*1.05+i*1.9)*5;
    let jit=0,flk=1,ts='';
    const gl=t>3.0&&t<3.62;
    if(gl){const hh=hsh(Math.floor(t*34)+i*13);jit=hh>.45?(hsh(Math.floor(t*34)+i)-.5)*16:0;flk=hsh(Math.floor(t*30)+i*7)>.35?1:.2;if(jit)ts=`${jit*.35}px 0 rgba(39,230,255,.9),${-jit*.35}px 0 rgba(255,63,216,.9)`}
    const dead=t>3.62;
    const out2=1-prog(t,4.25,4.75);
    const x=clamp(o.x+o.w*o.sc/2+ch.dx-ch.w/2,16,W-16-ch.w)+jit,y=ch.y+drift+(1-inP)*14+prog(t,4.25,4.75)*14;
    ch.el.style.transform=`translate(${x}px,${y}px)`;
    ch.el.style.opacity=inP*flk*out2*(dead?.8:1);
    ch.el.style.textShadow=ts;
    ch.el.style.color=dead?'#a2475a':'#ff93a6';
    ch.el.style.textDecoration=dead?'line-through':'none';
    ch.el.style.borderColor=dead?'rgba(255,59,92,.35)':'rgba(255,59,92,.6)';
    /* connector */
    const cx=x+ch.w/2, cy=y+(-1), h=c.el.offsetHeight*o.sc;
    const tx=o.x+o.w*o.sc/2, ty=o.y+h+1;
    ch.path.setAttribute('d',`M${cx.toFixed(1)} ${cy.toFixed(1)} C${cx.toFixed(1)} ${(cy-70).toFixed(1)} ${tx.toFixed(1)} ${(ty+70).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)}`);
    const dp=eo(prog(t,a0+.1,a0+.7));
    const q=prog(t,3.52+i*.06,3.95+i*.06);
    let dash;
    if(q>0){const a=.5*(1-q)*(1-q);dash=`${a.toFixed(4)} ${Math.max(0,1-2*a).toFixed(4)} ${a.toFixed(4)} 3`}
    else dash=`${dp.toFixed(4)} 3`;
    ch.path.setAttribute('stroke-dasharray',dash);
    const base=gl?(hsh(Math.floor(t*28)+i*5)>.4?1:.25):(.78+.22*Math.sin(t*5+i));
    ch.path.setAttribute('opacity',(base*out2*(dp>0?1:0)).toFixed(3));
    {const L0=ch.path.getTotalLength();const kk=((t*.8+i*.27)%1);const on=dp>=1&&q===0&&!gl;
      if(on){const pt=ch.path.getPointAtLength((1-kk)*L0);ch.dot.setAttribute('cx',pt.x);ch.dot.setAttribute('cy',pt.y);ch.dot.setAttribute('opacity',(1-prog(t,4.25,4.5)))}else ch.dot.setAttribute('opacity',0)}
    /* stamp + sparks at midpoint */
    const mx=(cx+tx)/2,my=(cy+ty)/2;
    const sp=prog(t,3.52+i*.06,3.8+i*.06);
    const pop=1+.35*(1-eo(prog(t,3.55+i*.06,3.8+i*.06)));
    ch.stamp.style.transform=`translate(${(mx-48).toFixed(1)}px,${(my-22).toFixed(1)}px) rotate(${(-5+i*2.5).toFixed(1)}deg) scale(${pop.toFixed(3)})`;
    ch.stamp.style.opacity=(sp>0?1:0)*out2;
    ch.sparks.forEach((s,k)=>{
      const ang=k*Math.PI/4+i*.4,sk=prog(t,3.52+i*.06,4.0+i*.06),r=eo(sk)*(34+hsh(k+i*9)*22);
      s.setAttribute('cx',(mx+Math.cos(ang)*r).toFixed(1));s.setAttribute('cy',(my+Math.sin(ang)*r).toFixed(1));
      s.setAttribute('opacity',(sk>0&&sk<1?(1-sk):0).toFixed(2));
    });
  });

  /* --- edges --- */
  EDGES.forEach((e,ei)=>{
    const p=eo(prog(t,e.show[0],e.show[1]));
    const hp=e.hot?eo(prog(t,e.hot[0],e.hot[1])):(e.id==='next'?eo(prog(t,7.1,7.7)):0);
    const gone=!(p>0);
    const els=[e.base,e.hotp,e.arrow,e.port,e.dot,e.pill];
    els.forEach(x=>{if(x.style)x.style.visibility=gone?'hidden':'visible'});
    if(gone){e.aEl.style.background='';return}
    const hr=R(cards[e.host].el),a=R(e.aEl),d=R(cards[e.to].el);
    const sx=e.side==='R'?hr.x+hr.w:hr.x,sy=a.y+a.h/2;
    const ex=e.side==='R'?d.x:d.x+d.w,ey=d.y+14;
    const sg=ex>sx?1:-1,dx=Math.max(34,Math.abs(ex-sx)*.5)*sg;
    const dstr=`M${sx.toFixed(1)} ${sy.toFixed(1)} C${(sx+dx).toFixed(1)} ${sy.toFixed(1)} ${(ex-dx).toFixed(1)} ${ey.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
    e.base.setAttribute('d',dstr);e.hotp.setAttribute('d',dstr);
    e.base.setAttribute('stroke-dasharray',`${p.toFixed(4)} 3`);
    e.base.setAttribute('opacity',(.55+.45*(1-hp)).toFixed(2));
    e.hotp.setAttribute('stroke-dasharray',`${hp.toFixed(4)} 3`);
    e.hotp.setAttribute('opacity',hp>0?1:0);
    const ar=p>.97?1:0;
    const hotNow=hp>.99;
    e.arrow.setAttribute('d',`M${ex} ${ey} l${-sg*11} -5.5 l0 11 z`);
    e.arrow.setAttribute('fill',hotNow?'#3dff9a':'#27e6ff');
    e.arrow.setAttribute('opacity',ar);
    e.port.setAttribute('cx',sx);e.port.setAttribute('cy',sy);e.port.setAttribute('fill',hp>0?'#3dff9a':'#27e6ff');e.port.setAttribute('opacity',p>0?1:0);
    /* pulse dot */
    const len=e.base.getTotalLength();
    const dotP=(hp>0&&hp<.995)?hp:(e.id==='next'||e.id==='cust2'?-1:-1);
    if(dotP>=0){const pt=e.base.getPointAtLength(dotP*len);e.dot.setAttribute('cx',pt.x);e.dot.setAttribute('cy',pt.y);e.dot.setAttribute('opacity',1)}else e.dot.setAttribute('opacity',0);
    /* pill */
    const mp=e.base.getPointAtLength(len*.5);
    e.pill.style.transform=`translate(${(mp.x).toFixed(1)}px,${(mp.y).toFixed(1)}px) translate(-50%,-50%)`;
    e.pill.style.opacity=clamp((p-.55)*2.2);
    e.pill.style.color=hotNow?'#c9ffe0':'#86f1ff';e.pill.style.borderColor=hotNow?'rgba(61,255,154,.8)':'rgba(39,230,255,.6)';
    e.pill.style.boxShadow=hotNow?'0 0 14px rgba(61,255,154,.45)':'none';
    /* anchor row highlight */
    const tint=hp>0?`rgba(61,255,154,${.18*Math.min(1,hp*3)})`:`rgba(39,230,255,${.13*p})`;
    e.aEl.style.background=tint;
  });
  /* edge-with-hot for next: anchor highlight turns green */
  /* in-card pulse: _embedded -> o124 */
  {
    const k=eo(prog(t,8.1,8.5));
    const el=R(embLine),o4=R(cards.o124.el),p2r=R(cards.p2.el);
    const x=p2r.x+7,y1=el.y+el.h/2,y2=o4.y+14;
    inPath.setAttribute('d',`M${(x+5).toFixed(1)} ${y1.toFixed(1)} L${x.toFixed(1)} ${y1.toFixed(1)} L${x.toFixed(1)} ${y2.toFixed(1)} L${(x+7).toFixed(1)} ${y2.toFixed(1)}`);
    inPath.setAttribute('stroke-dasharray',`${k.toFixed(4)} 3`);
    inPath.setAttribute('opacity',k>0?(1-prog(t,8.9,9.2)*.8):0);
    const len=inPath.getTotalLength();
    if(k>0&&k<.995){const pt=inPath.getPointAtLength(k*len);inDot.setAttribute('cx',pt.x);inDot.setAttribute('cy',pt.y);inDot.setAttribute('opacity',1)}else inDot.setAttribute('opacity',0);
  }
  /* cust arrival glow ring */
  /* world opacity (outro ghost) */
  const ghost=1-.94*eo(prog(t,9.7,10.2));
  world.style.opacity=ghost;

  /* --- crumb --- */
  {
    const cr=$('#crumb');
    cr.style.opacity=eo(prog(t,6.75,7.0))*(1-eo(prog(t,9.6,9.9)));
    const items=[...cr.querySelectorAll('.cr')];
    const on=[prog(t,6.9,7.05),prog(t,7.1,7.25),prog(t,8.1,8.25),prog(t,8.5,8.65)];
    items.forEach((it,i)=>{
      const k=on[i];
      it.style.color=rgb(mixc([78,101,115],GRN,k));
      it.style.borderColor=rgb(mixc(LINE,GRN,k));
      it.style.boxShadow=k>0?`0 0 ${14*k}px rgba(61,255,154,${.3*k})`:'none';
    });
  }

  /* --- captions --- */
  {
    let html='',op=0;
    for(const cp of CAPS){
      if(t>=cp.a&&t<cp.b+.35){
        op=Math.min(prog(t,cp.a,cp.a+.12),1-prog(t,cp.b,cp.b+.35));
        html=capHTML(cp,Math.min(t,cp.b));
      }
    }
    capEl.innerHTML=html;capEl.style.opacity=op;
  }
  /* --- beat label + segments --- */
  {
    const b=BEATS.find(b=>t>=b[0]&&t<b[1])||BEATS[4];
    const idx=BEATS.indexOf(b);
    const cl=idx===1?'#ff3b5c':'#3dff9a';
    $('#beat').innerHTML=`<b style="color:${cl}">${b[2]}</b><span>${b[3]}</span>`;
    segs.forEach((s,i)=>{s.style.background=i<idx?'#1d6b46':i===idx?(idx===1?'#ff3b5c':'#3dff9a'):'#13212a';s.style.boxShadow=i===idx?`0 0 10px ${idx===1?'#ff3b5c':'#3dff9a'}`:'none'});
    $('#beat').style.opacity=prog(t,.1,.5);
  }

  /* --- outro --- */
  {
    const o=$('#outro');
    const wmk=eo(prog(t,9.85,10.45));
    o.style.opacity=wmk>0?1:0;
    const wm=$('#wm');
    const wj=wmk<1&&wmk>0?(hsh(Math.floor(t*40))-.5)*10*(1-wmk):0;
    wm.style.clipPath=`inset(0 ${((1-wmk)*100).toFixed(1)}% 0 0)`;
    wm.style.transform=`translateX(${wj.toFixed(1)}px)`;
    $('#tag').style.opacity=eo(prog(t,10.3,10.7));
    $('#tag').style.transform=`translateY(${((1-eo(prog(t,10.3,10.7)))*8).toFixed(1)}px)`;
    const cp=eo(prog(t,10.15,10.55));
    const code=$('#code');
    code.style.opacity=cp;code.style.transform=`translateY(${((1-cp)*16).toFixed(1)}px)`;
    const typ=prog(t,10.5,11.75);
    const n=Math.floor(eio(typ*.5+.0)*0+typ*CODELEN);
    $('#codepre').innerHTML=codeHTML(n);
    const ik=eo(prog(t,11.7,12.05));
    $('#inst').style.opacity=ik;$('#inst').style.transform=`translateY(${((1-ik)*10).toFixed(1)}px)`;
    $('#icur').style.opacity=(Math.floor(t*2.2)%2===0)?1:0;
    $('#foot').style.opacity=eo(prog(t,12.0,12.35));
  }
  $('#fade').style.opacity=Math.max(1-eo(prog(t,0,.35)),prog(t,12.6,DUR));
}

/* ---------- fit + play ---------- */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);const f=$('#fit');f.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
let manual=false;
window.seek=t=>{manual=true;render(t)};
window.DURATION=DUR;window.FINAL_T=FINAL_T;
window.__ready=true;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){manual=true;render(FINAL_T)}
else{const t0=performance.now();const loop=n=>{if(!manual)render(Math.max(0,(n-t0)/1000));requestAnimationFrame(loop)};requestAnimationFrame(loop)}
render(0);
})();
</script>
</body>
